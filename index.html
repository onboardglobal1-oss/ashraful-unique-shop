<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2a6e">
<title>UG Technical Support</title>
<style>
:root{--blue:#1565e8;--navy:#0a1f52;--ink:#0f1f3d;--muted:#52627f;--bg:#f3f6fc;--line:#e1e8f5;--red:#d92b3a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:68px}
body{font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:inherit;text-decoration:none}
/* header */
header{position:fixed;inset:0 0 auto 0;z-index:30;height:calc(60px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{line-height:1.15}.logo b{font-size:19px;font-weight:800;letter-spacing:-.4px;color:var(--navy)}.logo b span{color:var(--blue)}
.logo small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.4px}
.burger{width:42px;height:42px;border:0;border-radius:10px;background:var(--bg);color:var(--navy);font-size:22px;display:grid;place-items:center;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(5,15,45,.55);opacity:0;pointer-events:none;transition:.3s;z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:78%;max-width:320px;background:#fff;z-index:50;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:calc(16px + env(safe-area-inset-top,0px)) 20px 20px;display:flex;flex-direction:column}
body.open .drawer{transform:none}body.open .ov{opacity:1;pointer-events:auto}
.drawer .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.drawer a.l{display:flex;gap:14px;align-items:center;padding:14px 8px;font-weight:600;border-bottom:1px solid var(--line);font-size:16px}
.drawer a.l .ic{font-size:20px;color:var(--blue)}
/* hero */
.hero{position:relative;padding:calc(60px + env(safe-area-inset-top,0px)) 16px 26px;background:#0a1f52}.bn{max-width:720px;margin:14px auto 0;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 18px 38px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.14);animation:fl 4.5s ease-in-out infinite}.bn img{display:block;width:100%;height:auto}@keyframes fl{50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){.bn{animation:none}}
}) center/cover;filter:blur(7px) brightness(.75) saturate(1.2);transform:scale(1.1)}
.track{position:relative;z-index:2;overflow:hidden;aspect-ratio:3.2/1;touch-action:pan-y}
.sl{position:absolute;inset:0;padding:0;display:flex;flex-direction:column;justify-content:center;transition:transform .7s cubic-bezier(.65,0,.25,1)}.sl:not(:first-child){padding:8px 22px}
.frame{height:100%;background:#000}
.frame img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 12%}
.sl h2{font-size:22px;line-height:1.2;margin-bottom:4px}.sl.row{flex-direction:row;align-items:center;gap:18px}
.sl p{color:#d3e1ff;font-size:13px;line-height:1.4}
.ck{list-style:none}.ck li{display:flex;gap:12px;align-items:center;font-weight:600;font-size:14.5px;margin:5px 0}
.ck .ic{font-size:26px;padding:4px;border:2px solid #7fc2ff;border-radius:50%;color:#7fc2ff}
.shieldbig{font-size:52px;color:#8fd3ff;filter:drop-shadow(0 0 16px #3da5ff);margin-bottom:0}
.dots{position:absolute;z-index:3;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:8px}
.dots i{width:8px;height:8px;border-radius:8px;background:rgba(255,255,255,.45);transition:.4s}.dots i.on{width:26px;background:#fff}
/* sections */
main{padding:0 16px}
section{padding:30px 0 6px}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.eyebrow::before{content:"";width:22px;height:3px;border-radius:3px;background:var(--blue)}
h3.t{font-size:20px;line-height:1.25;color:var(--navy);margin-bottom:14px}
.notice{margin-top:18px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center}
.notice .ic{font-size:24px;color:var(--red)}.notice span{flex:1;font-weight:600;font-size:14px}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;background:var(--blue);color:#fff;font-weight:700;border-radius:10px;padding:12px 22px;box-shadow:0 6px 16px rgba(21,101,232,.3);transition:transform .2s}
.btn:active{transform:scale(.97)}.btn.sm{padding:8px 14px;font-size:13px;background:var(--red);box-shadow:none}.btn.w{width:100%}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;font-weight:600;font-size:14.5px;overflow:hidden;box-shadow:0 4px 14px rgba(15,31,61,.05)}
.card summary{display:flex;align-items:center;gap:14px;padding:12px 14px;cursor:pointer;list-style:none}.card summary::-webkit-details-marker{display:none}.card summary::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border-right:2px solid #9fb0cf;border-bottom:2px solid #9fb0cf;transform:rotate(45deg);transition:transform .3s}.card[open] summary::after{transform:rotate(225deg)}.card ul{padding:0 16px 14px 62px;font-weight:500;font-size:14px;color:var(--muted)}.card li{margin:7px 0}.card.faq summary{padding:15px 14px}.card.faq p{padding:0 16px 14px;font-weight:500;font-size:14px;color:var(--muted)}
.card .ic{width:46px;height:46px;padding:11px;border-radius:12px}
.k1 .ic{background:#fde7e9;color:#d92b3a}.k2 .ic{background:#e2edff;color:#1565e8}.k3 .ic{background:#dcf5e8;color:#16895a}.k4 .ic{background:#eee3fb;color:#6a31c4}.k5 .ic{background:#ffeed6;color:#c25e00}
.ticker{margin:18px -16px 0;background:none;color:var(--ink);padding:8px 0;overflow:hidden;white-space:nowrap;font-weight:600;font-size:14px}
.ticker div{display:inline-block;padding-left:100%;animation:mq 20s linear infinite}.ticker b{color:var(--red)}
@keyframes mq{to{transform:translateX(-100%)}}
.about img{width:100%;border-radius:14px;display:block;box-shadow:0 10px 26px rgba(10,31,82,.25);margin-bottom:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.stats div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;box-shadow:0 4px 14px rgba(15,31,61,.05)}.stats b{display:block;font-size:22px;color:var(--blue);line-height:1.2}.stats small{color:var(--muted);font-weight:600;font-size:12px}
.about p{color:var(--muted);margin-bottom:16px}
.banner{position:relative;overflow:hidden;margin:34px 16px 0;padding:18px 18px 18px 22px;background:#fff;border:1px solid #ffe0ad;border-radius:16px;box-shadow:0 8px 22px rgba(224,138,0,.14);display:flex;gap:16px;align-items:center}
.banner .ic{font-size:28px;width:56px;height:56px;padding:14px;border-radius:50%;background:#fff1d6;color:#e08a00;flex:none;animation:pl 2s infinite}.banner h3{font-size:20px;color:var(--navy)}.banner p{color:var(--muted);font-size:14px;margin-top:2px;line-height:1.45}@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,176,32,.5)}100%{box-shadow:0 0 0 14px rgba(255,176,32,0)}}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 14px rgba(15,31,61,.05)}
.list{list-style:none;margin-bottom:18px}.list li{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-weight:500}
.list .ic{color:var(--blue);margin-top:5px;font-size:16px}
.ct{display:flex;gap:14px;align-items:flex-start;padding:10px 0}
.ct .ic{font-size:40px;padding:10px;border-radius:12px;background:#e2edff;color:var(--blue)}.ct small{display:block;color:var(--muted);font-size:12px}.ct b{font-size:14.5px;word-break:break-word}
.soc{display:flex;justify-content:center;gap:22px;margin:6px 0 16px}
.soc a{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted)}.soc a span{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 6px 14px rgba(15,31,61,.2);transition:transform .2s}.soc a:active span{transform:scale(.92)}
footer{margin-top:34px;background:#040c26;color:#cbd7f5;padding:28px 16px calc(24px + env(safe-area-inset-bottom,0px));font-size:13px}
footer nav{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:16px}footer nav a{color:#fff;font-weight:600}
.tag{margin-top:16px;display:inline-flex;gap:9px;align-items:center;padding:8px 11px;border:1px solid rgba(110,180,255,.35);border-radius:10px;background:rgba(8,35,100,.5);color:#fff;font:600 11.5px/1.35 ui-monospace,Menlo,Consolas,monospace}.tag>.ic{font-size:20px;color:#7fc2ff}.tag span::after{content:'_';animation:bl 1s steps(1) infinite;color:#7fc2ff}@keyframes bl{50%{opacity:0}}
.flag{display:block;height:3px;margin-top:6px;border-radius:3px;background:linear-gradient(90deg,#ff9933 33%,#fff 33% 66%,#138808 66%)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}.stat b{display:block;font-size:28px;color:var(--blue);line-height:1.1}.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}.row:last-child{border:0}.row span{color:var(--muted)}.row b{text-align:right}
.svc small{font-size:13.5px;line-height:1.5}.svc b{font-size:15.5px;color:var(--navy)}.note{margin-top:10px;padding:12px 14px;border-radius:10px;background:#fff1f2;color:#9b1c2a;font-size:13.5px;font-weight:600}
.steps{list-style:none;counter-reset:s;margin-bottom:14px}.steps li{counter-increment:s;display:flex;gap:12px;padding:9px 0;font-weight:500;font-size:14.5px}.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.btns{display:flex;gap:10px}.btns .btn{flex:1;padding:12px 8px;font-size:14px}.sub{color:var(--muted);margin:-6px 0 14px}
#contact .ct{padding:7px 0;gap:12px;align-items:center}#contact .ct .ic{font-size:30px;padding:7px;background:#eef2fa;color:#7a8bab;border-radius:8px}#contact .ct b{font-size:13.5px;font-weight:500;color:var(--ink)}#contact .ct small{font-size:11px}#contact .ct.hl .ic{background:#e2edff;color:var(--blue)}#contact .ct.hl b{font-size:14.5px;font-weight:700}
#social{padding-top:14px}#social .t{font-size:14px;color:var(--muted);margin-bottom:8px}#social .eyebrow{display:none}#social p{font-size:12px!important;font-weight:500!important}.soc{gap:16px!important;margin:4px 0 10px!important}.soc a{font-size:11px!important;gap:5px!important;opacity:.8}.soc a span{width:36px!important;height:36px!important;font-size:16px!important;background:#e6edf8!important;color:#667a9e!important;box-shadow:none!important}
#social .tag{display:flex;width:fit-content;margin:0;background:#0a1f52;font-size:10.5px;padding:6px 9px;gap:7px}#social .tag>.ic{font-size:16px}#social{padding:22px 0 0}footer .soc{justify-content:flex-start!important;margin:10px 0 0!important}footer .soc a{color:#9fb2d8}footer .soc a span{background:rgba(255,255,255,.1)!important;color:#cfe0ff!important}
.aiw{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 8px 24px rgba(21,101,232,.1)}
.aih{display:flex;gap:12px;align-items:center;margin-bottom:14px}.bot{width:50px;height:50px;flex:none;animation:fl2 3s ease-in-out infinite}@keyframes fl2{50%{transform:translateY(-4px)}}.aih b{display:block;color:var(--navy);font-size:16px}.aih small{color:var(--muted);font-size:12.5px}
.eyes{transform-box:fill-box;transform-origin:center;animation:bk 4s infinite}@keyframes bk{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.ring{position:relative;border-radius:16px;padding:2.5px;overflow:hidden;background:#e3eaf8}
.ring::before{content:"";position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;translate:-50% -50%;background:conic-gradient(from 0deg,transparent 0 35%,#1565e8,#7b3fe4,#e1306c,#ffb020,#25d366,transparent 90%);animation:spin 3s linear infinite}@keyframes spin{to{rotate:360deg}}
.box{position:relative;display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:6px 6px 6px 12px}
.spk{font-size:20px;color:#7b3fe4;flex:none}.soon{flex:none;user-select:none;-webkit-user-select:none;pointer-events:none;font-size:11px;font-weight:700;color:#fff;padding:4px 9px;border-radius:99px;background:linear-gradient(90deg,#1565e8,#7b3fe4)}
.box input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--ink);padding:9px 2px}
.box button{flex:none;width:38px;height:38px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-size:18px;display:grid;place-items:center;cursor:pointer}
.aim{font-size:12.5px;color:var(--muted);margin-top:8px}.aim:empty{display:none}
.flash{animation:fh 1.8s}@keyframes fh{0%,60%{box-shadow:0 0 0 3px #7b3fe4}100%{box-shadow:0 0 0 3px transparent}}
@media(prefers-reduced-motion:reduce){.ring::before,.bot,.eyes{animation:none}}
/* scroll animation */
.rv{opacity:0;transform:translateX(-46px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.rv.r{transform:translateX(46px)}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.ticker div{animation:none;padding:0}.track{transition:none}html{scroll-behavior:auto}}
@media(min-width:760px){main{max-width:720px;margin:0 auto}.hero .track{max-width:none}}
</style></head><body>
