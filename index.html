<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UG Technical Support – Cyber Safe India</title>
<meta name="description" content="Learn how to protect yourself from cyber attacks, online fraud and digital threats. Cyber safety awareness from UG Technical Support.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --navy-900:#061239;
  --navy-800:#0a1b4d;
  --navy-700:#0e2a73;
  --blue-600:#0f4fd6;
  --blue-500:#1a66f0;
  --blue-100:#e3edff;
  --sky-50:#f2f6fd;
  --yellow:#ffd400;
  --red:#e11d1d;
  --red-dark:#c20f0f;
  --text:#14224a;
  --muted:#46557f;
  --white:#fff;
  --radius:14px;
  --radius-sm:10px;
  --gap:16px;
  --shadow:0 4px 16px rgba(10,27,77,.12);
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-impact:'Oswald','Poppins',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--text);background:var(--sky-50);line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
ul{list-style:none}
svg{display:inline-block;flex:none}
.container{width:100%;max-width:1240px;margin-inline:auto;padding-inline:16px}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:10px;font:600 15px/1 var(--font);padding:13px 22px;border-radius:999px;color:#fff;border:0;cursor:pointer;transition:transform .15s,box-shadow .15s,filter .15s}
.btn svg{width:18px;height:18px}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn--blue{background:linear-gradient(180deg,#1b6bff,#0b45c9);box-shadow:0 4px 10px rgba(15,79,214,.35)}
.btn--red{background:linear-gradient(180deg,#f03030,var(--red-dark));box-shadow:0 4px 10px rgba(225,29,29,.35)}
.btn--sm{padding:10px 16px;font-size:13px}
.btn--yt{background:linear-gradient(180deg,#ff2b2b,#c40f0f);font-size:20px;padding:14px 26px;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 6px 18px rgba(0,0,0,.35)}
.btn--yt svg{width:34px;height:34px}

/* ============ TOP BAR ============ */
.topbar{background:var(--navy-900);color:#fff;font-size:14px;font-weight:500}
.topbar__inner{display:flex;justify-content:space-between;align-items:center;min-height:48px;gap:12px}
.topbar__left,.topbar__right{display:flex;align-items:center;gap:14px}
.topbar__shield{width:28px;height:28px;color:#7db4ff}
.topbar__sep{width:1px;height:20px;background:rgba(255,255,255,.4)}
.soc{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;transition:transform .15s}
.soc:hover{transform:translateY(-2px)}
.soc svg{width:19px;height:19px}
.soc--yt{background:#ff0000}.soc--fb{background:#1877f2}.soc--tg{background:#2aabee}
.soc--ig{background:linear-gradient(45deg,#fcb045,#fd1d1d 50%,#833ab4)}

/* ============ HEADER ============ */
.header{background:#fff;box-shadow:0 2px 10px rgba(10,27,77,.08);position:sticky;top:0;z-index:50}
.header__inner{display:flex;align-items:center;justify-content:space-between;min-height:100px;gap:20px}
.brand{display:flex;align-items:center;gap:12px}
.brand__logo{width:84px;height:96px;margin-top:-6px;filter:drop-shadow(0 4px 6px rgba(10,47,158,.3))}
.brand__text strong{display:block;font-size:30px;font-weight:700;line-height:1.1;color:var(--navy-800);letter-spacing:-.5px}
.brand__text strong b{color:var(--blue-500);font-weight:800}
.brand__text small{display:block;font-size:19px;font-weight:500;color:var(--navy-700);margin-top:2px}
.brand__text small i{font-style:normal;margin:0 6px}
.nav{display:flex;align-items:center;gap:8px}
.nav__link{display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:600;font-size:16px;color:var(--navy-800);transition:background .15s,color .15s}
.nav__link svg{width:22px;height:22px;color:var(--navy-700)}
.nav__link:hover{background:var(--blue-100)}
.nav__link.is-active{background:linear-gradient(180deg,#1b6bff,#0b45c9);color:#fff;box-shadow:0 4px 10px rgba(15,79,214,.35)}
.nav__link.is-active svg{color:#fff}
.nav-toggle{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer;flex-direction:column;justify-content:center;gap:6px;padding:10px}
.nav-toggle span{display:block;height:3px;background:var(--navy-800);border-radius:2px}

/* ============ HERO ============ */
.hero{position:relative;margin-top:14px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.2fr);align-items:center;gap:40px;
  padding:26px 70px 46px 40px;border-radius:var(--radius);overflow:hidden;color:#fff;max-width:1240px;
  background:
    radial-gradient(circle at 85% 40%,rgba(80,160,255,.55),transparent 45%),
    radial-gradient(circle at 20% 80%,rgba(30,110,255,.5),transparent 40%),
    linear-gradient(120deg,#0a2d9c,#0c3ec2 50%,#0a2a8a);
  box-shadow:inset 0 0 0 3px rgba(80,150,255,.6)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.25) 1px,transparent 1.5px);background-size:26px 26px;opacity:.35;pointer-events:none}
.hero>*{position:relative}
.hero__video{position:relative;aspect-ratio:16/9.5;border:3px solid #fff;border-radius:12px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.hero__video img{width:100%;height:100%;object-fit:cover}
.hero__yt{position:absolute;top:10px;left:12px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.5);padding:3px 10px 3px 6px;border-radius:6px;font-weight:700;font-size:13px}
.hero__yt svg{width:24px;height:24px;color:#ff0000}
.hero__play{position:absolute;left:30%;top:50%;transform:translate(-50%,-50%);width:76px;height:54px;border-radius:14px;background:#ff0000;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.hero__play svg{width:30px;height:30px}
.hero__time{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.8);padding:2px 8px;border-radius:5px;font-weight:600;font-size:14px}
.hero__copy h1{font-size:clamp(34px,4.4vw,56px);font-weight:700;line-height:1.1;letter-spacing:-1px}
.hero__copy h1 span{display:block;color:var(--yellow);font-weight:800}
.hero__sub{font-size:clamp(20px,2.2vw,28px);font-weight:600;line-height:1.3;margin:16px 0 22px;max-width:420px}
.hero__row{display:flex;align-items:flex-end;gap:36px;flex-wrap:wrap}
.hero__checks{display:grid;gap:10px;font-weight:600;font-size:18px;margin-left:auto}
.hero__checks li{display:flex;align-items:center;gap:12px}
.hero__checks svg{width:32px;height:32px;color:#6db8ff;background:rgba(255,255,255,.1);border-radius:50%}
.hero__shield{position:absolute!important;right:140px;top:-6px;width:210px;opacity:.95;filter:drop-shadow(0 0 22px rgba(120,200,255,.7));pointer-events:none}
.hero__arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:var(--navy-800);font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.hero__arrow--prev{left:8px}.hero__arrow--next{right:8px}
.hero__arrow:hover{background:var(--yellow)}
.hero__dots{position:absolute;left:36%;bottom:14px;display:flex;gap:12px;z-index:3}
.hero__dots button{width:16px;height:16px;border-radius:50%;border:0;background:#fff;cursor:pointer;opacity:.95}
.hero__dots button.is-active{background:#1da1ff;box-shadow:0 0 0 2px #fff}

/* ============ WARNING STRIP ============ */
.strip{display:flex;align-items:center;gap:20px;margin-top:12px;padding:10px 16px;background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow);font-size:14.5px;font-weight:500}
.strip__item{display:flex;align-items:center;gap:12px;flex:1}
.strip__item--right{flex:1.1}
.strip__ico{width:36px;height:36px}
.strip__ico--red{color:var(--red)}.strip__ico--blue{color:var(--blue-500)}
.red{color:var(--red);font-weight:700}
.strip__div{width:2px;height:34px;background:var(--red)}

/* ============ PANELS ============ */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}
.panel{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.panel__title{display:flex;align-items:center;gap:14px;padding:14px 20px;color:#fff;font-size:22px;font-weight:600;background:linear-gradient(180deg,#1659e6,#0c3fb8)}
.panel__title svg{width:34px;height:34px}
.about{display:grid;grid-template-columns:210px 1fr;gap:18px;padding:16px}
.about__img{border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px #2f7dff,0 6px 16px rgba(10,50,160,.4);min-height:210px}
.about__img svg{width:100%;height:100%;display:block}
.about__copy p{font-size:15.5px;color:var(--text);margin-bottom:16px;line-height:1.55}
.aware{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:16px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px 6px;border-radius:12px;font-weight:600;font-size:15px;line-height:1.25;border:1px solid transparent;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.card__ico{width:58px;height:58px}
.card--red{background:#fde3e3;border-color:#f7c5c5;color:#b01212}.card--red .card__ico{color:var(--red)}
.card--blue{background:#dbeafe;border-color:#bcd5fb;color:#1250c4}.card--blue .card__ico{color:#2166e8}
.card--green{background:#d8f5e4;border-color:#b3e8c9;color:#0d7a43}.card--green .card__ico{color:#14a05a}
.card--purple{background:#e8e1fa;border-color:#d3c7f4;color:#5a35b5}.card--purple .card__ico{color:#6c47d6}
.card--orange{background:#fdecd0;border-color:#f8d9a4;color:#a85a00}.card--orange .card__ico{color:#f08a00}

/* ============ BE ALERT BANNER ============ */
.alertband{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;border-radius:var(--radius);overflow:hidden;color:#fff;min-height:104px;
  background:linear-gradient(90deg,#0a2a8a,#0b1f66)}
.alertband h2{font-size:34px;font-weight:700;line-height:1.1;margin-bottom:4px}
.alertband p{font-size:14px;opacity:.95}
.alertband__left,.alertband__right{display:flex;align-items:center;gap:18px;padding:16px 28px}
.alertband__left{background:radial-gradient(circle at 15% 50%,rgba(60,140,255,.4),transparent 55%),linear-gradient(90deg,#0a2a8a,#0a1b55)}
.alertband__horn{width:90px;height:90px;color:var(--yellow)}
.alertband__right{position:relative;color:#111;background:
  repeating-linear-gradient(115deg,#111 0 6px,transparent 6px 22px) left/70px 100% no-repeat,
  var(--yellow);clip-path:polygon(60px 0,100% 0,100% 100%,0 100%);padding-left:90px}
.alertband__right::after{content:"";position:absolute;right:0;top:0;bottom:0;width:70px;background:repeating-linear-gradient(115deg,#111 0 6px,transparent 6px 22px)}
.alertband__right h2{font-size:30px;font-weight:700}
.alertband__warn{width:70px;height:62px}

/* ============ TRIO ============ */
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:16px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 0 22px}
.col{padding:0 20px}
.col--mid{border-inline:1px solid #d8e1f3}
.col__title{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:8px;background:var(--blue-100);color:var(--blue-600);font-size:21px;font-weight:600;margin-bottom:16px}
.col__title svg{width:32px;height:32px;color:var(--blue-600)}
.ticks{display:grid;gap:10px;font-size:14px;margin-bottom:18px;font-weight:500}
.ticks li{display:flex;gap:10px;align-items:flex-start}
.ticks svg{width:20px;height:20px;color:var(--blue-600);margin-top:2px}
.ticks svg path{stroke:currentColor}
.ticks svg circle{display:none}
.contact{display:grid;gap:9px;font-size:14.5px;margin-bottom:16px}
.contact li{display:flex;gap:14px;align-items:flex-start}
.contact svg{width:22px;height:22px;color:var(--navy-800);margin-top:2px}
.contact b{font-weight:600}
.contact a:hover{color:var(--blue-600);text-decoration:underline}
.social-big{display:flex;justify-content:center;gap:18px;margin:26px 0 24px}
.soc-big{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px rgba(10,27,77,.25);transition:transform .15s}
.soc-big:hover{transform:translateY(-4px) scale(1.04)}
.soc-big svg{width:40px;height:40px}
.social-note{text-align:center;font-weight:500;font-size:15px}

/* ============ FOOTER ============ */
.footer{margin-top:0;background:radial-gradient(circle at 20% 50%,rgba(30,90,230,.35),transparent 50%),var(--navy-900);color:#fff;padding:26px 0 30px}
.footer__inner{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:30px}
.brand--light .brand__text strong{color:#fff}
.brand--light .brand__text strong b{color:#4da3ff}
.brand--light .brand__text small{color:#cfe0ff}
.footer__mid{text-align:center;border-left:1px solid rgba(255,255,255,.3);padding-left:30px;font-size:15px}
.footer__nav,.footer__legal{display:flex;flex-wrap:wrap;justify-content:center;gap:0}
.footer__nav a,.footer__legal a{padding:0 14px;border-left:1px solid rgba(255,255,255,.5);line-height:1.1}
.footer__nav a:first-child{border-left:0}
.footer__legal a:first-child{border-left:0}
.footer__nav a:hover,.footer__legal a:hover{color:var(--yellow)}
.footer__mid p{margin-top:14px}
.footer__legal{margin-top:8px!important}
.footer__tag{text-align:center}
.footer__tag em{display:block;font:italic 600 24px/1.2 var(--font);text-shadow:0 0 12px rgba(100,170,255,.7)}
.footer__tag svg{width:190px;margin:4px 0 0 auto}

/* ============ RESPONSIVE ============ */
@media (max-width:1100px){
  .nav__link{padding:10px 12px;font-size:14.5px}
  .hero{padding:24px 60px 50px 30px;gap:24px}
  .hero__shield{display:none}
  .hero__checks{margin-left:0}
  .aware{grid-template-columns:repeat(3,1fr)}
  .card:nth-child(n+4){grid-column:span 1}
}
@media (max-width:900px){
  .nav-toggle{display:flex}
  .nav{position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;padding:12px 16px;box-shadow:0 12px 20px rgba(10,27,77,.15);display:none}
  .nav.is-open{display:flex}
  .header__inner{min-height:84px}
  .brand__logo{width:64px;height:74px}
  .brand__text strong{font-size:22px}.brand__text small{font-size:14px}
  .hero{grid-template-columns:1fr;padding:22px 20px 56px}
  .hero__dots{left:50%;transform:translateX(-50%)}
  .hero__arrow{top:30%}
  .strip{flex-wrap:wrap}.strip__div{display:none}
  .duo{grid-template-columns:1fr}
  .alertband{grid-template-columns:1fr}
  .alertband__right{clip-path:none;padding-left:28px}
  .alertband__right::after{display:none}
  .trio{grid-template-columns:1fr;gap:22px}
  .col--mid{border-inline:0;border-block:1px solid #d8e1f3;padding-block:20px}
  .footer__inner{grid-template-columns:1fr;text-align:center;justify-items:center}
  .footer__mid{border-left:0;padding-left:0}
  .footer__tag svg{margin-inline:auto}
}
@media (max-width:620px){
  .topbar__left span:nth-child(n+3){display:none}
  .topbar{font-size:12px}
  .about{grid-template-columns:1fr}
  .about__img{min-height:190px}
  .aware{grid-template-columns:repeat(2,1fr)}
  .alertband h2,.alertband__right h2{font-size:24px}
  .alertband__horn{width:60px;height:60px}
  .hero__row{gap:20px}
  .btn--yt{font-size:17px}
}

/* ---- fixes ---- */
.nav__link{white-space:nowrap;padding:10px 14px;font-size:15px}
.nav{gap:4px}
.brand__text strong{font-size:27px;white-space:nowrap}
.brand__text small{font-size:17px;white-space:nowrap}
.header__inner{gap:12px}
.hero{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);padding:24px 64px 50px 36px;gap:34px}
.hero__copy h1{font-size:clamp(32px,3.8vw,50px);max-width:480px}
.hero__sub{max-width:380px;font-size:clamp(18px,1.9vw,24px)}
.hero__shield{right:64px;top:18px;width:170px}
.hero__row{gap:18px;align-items:flex-end}
.hero__checks{font-size:16px;margin-left:auto}
.hero__checks svg{width:28px;height:28px}
.btn--yt{font-size:18px;padding:12px 22px}
.hero__dots{left:30%}
.ticks svg{width:18px;height:18px}
.footer__nav a,.footer__legal a{white-space:nowrap;padding:0 11px;font-size:14px}
.footer__nav{flex-wrap:nowrap}
.footer__inner{grid-template-columns:auto minmax(0,1fr) auto;gap:22px}
.footer__mid{padding-left:22px}
@media (max-width:1100px){.hero__shield{display:none}.footer__nav{flex-wrap:wrap}}
@media (max-width:900px){
  .footer__nav{flex-wrap:wrap}
  .footer__mid{min-width:0;width:100%}
  .footer__inner{grid-template-columns:minmax(0,1fr)}
  .brand__text strong{font-size:20px}.brand__text small{font-size:12px}
  .brand__logo{width:52px;height:60px}
  .header__inner{gap:6px}
}

</style>
</head>
