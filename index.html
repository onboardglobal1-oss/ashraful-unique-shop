<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061239">
<title>UG Technical Support – Cyber Safe India</title>
<meta name="description" content="Learn how to protect yourself from cyber attacks, online fraud and digital threats. Cyber safety awareness from UG Technical Support.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>

/* =========================================================
   UG Technical Support – MOBILE-FIRST stylesheet
   Base = phones (360–430px). Larger screens enhance below.
   ========================================================= */
:root{
  --navy-900:#061239;--navy-800:#0a1b4d;--navy-700:#0e2a73;
  --blue-600:#0f4fd6;--blue-500:#1a66f0;--blue-100:#e3edff;--sky-50:#f2f6fd;
  --yellow:#ffd400;--red:#e11d1d;--red-dark:#c20f0f;
  --text:#14224a;--muted:#46557f;
  --radius:16px;--radius-sm:12px;
  --shadow:0 3px 12px rgba(10,27,77,.12);
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --tap:48px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);font-size:16px;color:var(--text);background:var(--sky-50);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
ul{list-style:none}
svg{display:inline-block;flex:none}
.container{width:100%;margin-inline:auto}
main .container{width:calc(100% - 20px);max-width:1240px}

/* ---------- Buttons (big touch targets) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:var(--tap);font:600 16px/1.2 var(--font);padding:12px 22px;border-radius:999px;color:#fff;border:0;cursor:pointer;transition:transform .15s,filter .15s}
.btn svg{width:18px;height:18px}
.btn:active{transform:scale(.97)}
.btn--blue{background:linear-gradient(180deg,#1b6bff,#0b45c9);box-shadow:0 4px 10px rgba(15,79,214,.35)}
.btn--red{background:linear-gradient(180deg,#f03030,var(--red-dark));box-shadow:0 4px 10px rgba(225,29,29,.35)}
.btn--sm{min-height:44px;font-size:15px}
.btn--yt{width:100%;min-height:56px;font-size:19px;background:linear-gradient(180deg,#ff2b2b,#c40f0f);box-shadow:0 0 0 3px rgba(255,255,255,.9),0 6px 18px rgba(0,0,0,.35)}
.btn--yt svg{width:32px;height:32px}
.about__copy .btn,.col .btn,.strip .btn{width:100%}

/* ---------- Top bar ---------- */
.topbar{background:var(--navy-900);color:#fff;font-size:13px;font-weight:500}
.topbar__inner{display:flex;justify-content:space-between;align-items:center;min-height:44px;gap:10px;padding-inline:12px}
.topbar__left,.topbar__right{display:flex;align-items:center;gap:8px}
.topbar__shield{width:22px;height:22px;color:#7db4ff}
.topbar__sep,.topbar__left span:last-child,.topbar__right>span{display:none}
.soc{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff}
.soc svg{width:18px;height:18px}
.soc--yt{background:#ff0000}.soc--fb{background:#1877f2}.soc--tg{background:#2aabee}
.soc--ig{background:linear-gradient(45deg,#fcb045,#fd1d1d 50%,#833ab4)}

/* ---------- Header ---------- */
.header{background:#fff;box-shadow:0 2px 10px rgba(10,27,77,.1);position:sticky;top:0;z-index:50}
.header__inner{display:flex;align-items:center;justify-content:space-between;min-height:68px;padding-inline:12px;gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand__logo{width:46px;height:54px;flex:none;filter:drop-shadow(0 3px 5px rgba(10,47,158,.3))}
.brand__text strong{display:block;font-size:19px;font-weight:700;line-height:1.1;color:var(--navy-800);white-space:nowrap}
.brand__text strong b{color:var(--blue-500);font-weight:800}
.brand__text small{display:block;font-size:11.5px;font-weight:500;color:var(--navy-700);white-space:nowrap}
.brand__text small i{font-style:normal;margin:0 4px}
.nav-toggle{display:flex;flex-direction:column;justify-content:center;gap:5px;width:48px;height:48px;padding:12px;background:var(--blue-100);border:0;border-radius:12px;cursor:pointer}
.nav-toggle span{display:block;height:3px;background:var(--navy-800);border-radius:2px}
.nav{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;padding:8px 12px 14px;box-shadow:0 14px 24px rgba(10,27,77,.2);flex-direction:column;gap:6px}
.nav.is-open{display:flex}
.nav__link{display:flex;align-items:center;gap:14px;min-height:52px;padding:0 16px;border-radius:12px;font-weight:600;font-size:17px;color:var(--navy-800);background:var(--sky-50)}
.nav__link svg{width:24px;height:24px;color:var(--navy-700)}
.nav__link.is-active{background:linear-gradient(180deg,#1b6bff,#0b45c9);color:#fff}
.nav__link.is-active svg{color:#fff}

/* ---------- Hero ---------- */
.hero{position:relative;margin-top:10px;padding:14px 14px 22px;border-radius:var(--radius);overflow:hidden;color:#fff;
  background:radial-gradient(circle at 85% 30%,rgba(80,160,255,.55),transparent 45%),radial-gradient(circle at 15% 85%,rgba(30,110,255,.5),transparent 40%),linear-gradient(135deg,#0a2d9c,#0c3ec2 55%,#0a2a8a);
  box-shadow:inset 0 0 0 2px rgba(80,150,255,.6)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.25) 1px,transparent 1.5px);background-size:22px 22px;opacity:.3;pointer-events:none}
.hero>*{position:relative}
.hero__video{position:relative;aspect-ratio:16/10;border:3px solid #fff;border-radius:12px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.hero__video img{width:100%;height:100%;object-fit:cover}
.hero__yt{position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.55);padding:2px 9px 2px 5px;border-radius:6px;font-weight:700;font-size:12px}
.hero__yt svg{width:20px;height:20px;color:#ff0000}
.hero__play{position:absolute;left:30%;top:50%;transform:translate(-50%,-50%);width:58px;height:42px;border-radius:12px;background:#ff0000;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.hero__play svg{width:24px;height:24px}
.hero__time{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);padding:1px 7px;border-radius:5px;font-weight:600;font-size:12px}
.hero__arrow{position:absolute;z-index:3;top:calc(14px + (100vw - 48px) * .3125);transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:var(--navy-800);font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.hero__arrow--prev{left:2px}.hero__arrow--next{right:2px}
.hero__copy{margin-top:18px;text-align:center}
.hero__copy h1{font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.5px}
.hero__copy h1 span{display:block;color:var(--yellow);font-weight:800;font-size:34px}
.hero__sub{font-size:17px;font-weight:500;line-height:1.35;margin:10px 0 18px;opacity:.95}
.hero__sub br{display:none}
.hero__row{display:flex;flex-direction:column;gap:18px}
.hero__checks{display:grid;gap:10px;font-weight:600;font-size:16px;text-align:left;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:14px}
.hero__checks li{display:flex;align-items:center;gap:12px}
.hero__checks svg{width:28px;height:28px;color:#8ccaff}
.hero__shield{display:none}
.hero__dots{display:flex;justify-content:center;gap:12px;margin-top:20px}
.hero__dots button{width:12px;height:12px;border-radius:50%;border:0;background:rgba(255,255,255,.6);cursor:pointer;padding:0}
.hero__dots button.is-active{background:#fff;box-shadow:0 0 0 3px rgba(29,161,255,.9);transform:scale(1.1)}

/* ---------- Warning strip ---------- */
.strip{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding:12px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);font-size:15px}
.strip__item{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:var(--radius-sm)}
.strip__item:first-child{background:#fff0f0;border-left:5px solid var(--red)}
.strip__item--right{background:var(--blue-100)}
.strip__item p{line-height:1.45}
.strip__ico{width:30px;height:30px}
.strip__ico--red{color:var(--red)}.strip__ico--blue{color:var(--blue-500)}
.strip__div{display:none}
.red{color:var(--red);font-weight:700;display:block}

/* ---------- Panels ---------- */
.duo{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
.panel{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.panel__title{display:flex;align-items:center;gap:12px;padding:14px 16px;color:#fff;font-size:19px;font-weight:600;background:linear-gradient(180deg,#1659e6,#0c3fb8)}
.panel__title svg{width:28px;height:28px}
.about{display:grid;grid-template-columns:1fr;gap:14px;padding:14px}
.about__img{border-radius:12px;overflow:hidden;box-shadow:0 0 0 2px #2f7dff;height:190px}
.about__img svg{width:100%;height:100%;display:block}
.about__copy p{font-size:16px;line-height:1.6;margin-bottom:14px}
.aware{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:124px;padding:14px 8px;border-radius:14px;font-weight:600;font-size:15px;line-height:1.25;border:1px solid transparent}
.card:active{transform:scale(.97)}
.card:last-child{grid-column:1/-1;min-height:96px}
.card__ico{width:50px;height:50px}
.card--red{background:#fde3e3;border-color:#f7c5c5;color:#b01212}.card--red .card__ico{color:var(--red)}
.card--blue{background:#dbeafe;border-color:#bcd5fb;color:#1250c4}.card--blue .card__ico{color:#2166e8}
.card--green{background:#d8f5e4;border-color:#b3e8c9;color:#0d7a43}.card--green .card__ico{color:#14a05a}
.card--purple{background:#e8e1fa;border-color:#d3c7f4;color:#5a35b5}.card--purple .card__ico{color:#6c47d6}
.card--orange{background:#fdecd0;border-color:#f8d9a4;color:#a85a00}.card--orange .card__ico{color:#f08a00}

/* ---------- Be Alert banner (stacked) ---------- */
.alertband{display:grid;grid-template-columns:1fr;margin-top:14px;border-radius:var(--radius);overflow:hidden;color:#fff}
.alertband h2{font-size:25px;font-weight:700;line-height:1.15;margin-bottom:4px}
.alertband p{font-size:14.5px;line-height:1.4}
.alertband__left,.alertband__right{display:flex;align-items:center;gap:16px;padding:20px 18px}
.alertband__left{background:radial-gradient(circle at 12% 50%,rgba(60,140,255,.45),transparent 55%),linear-gradient(90deg,#0a2a8a,#0a1b55)}
.alertband__horn{width:56px;height:56px;color:var(--yellow)}
.alertband__right{color:#111;padding-block:26px;
  background:repeating-linear-gradient(135deg,#111 0 10px,var(--yellow) 10px 20px) top/100% 8px no-repeat,
             repeating-linear-gradient(135deg,#111 0 10px,var(--yellow) 10px 20px) bottom/100% 8px no-repeat,var(--yellow)}
.alertband__warn{width:54px;height:48px}

/* ---------- Terms / Contact / Social (separate cards) ---------- */
.trio{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
.col{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.col__title{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:var(--blue-100);color:var(--blue-600);font-size:19px;font-weight:600;margin-bottom:14px}
.col__title svg{width:28px;height:28px}
.ticks{display:grid;gap:12px;font-size:15.5px;margin-bottom:16px}
.ticks li{display:flex;gap:10px;align-items:flex-start}
.ticks svg{width:20px;height:20px;color:var(--blue-600);margin-top:3px}
.contact{display:grid;gap:4px;font-size:15.5px;margin-bottom:14px}
.contact li{display:flex;gap:14px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid #e6ecf8}
.contact li:last-child{border-bottom:0}
.contact svg{width:24px;height:24px;color:var(--blue-600);margin-top:2px}
.contact b{font-weight:600;display:block;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.contact span{min-width:0;overflow-wrap:anywhere}
.contact a{color:var(--blue-600);font-weight:600}
.social-big{display:flex;justify-content:space-between;gap:10px;margin:8px 0 16px;padding-inline:4px}
.soc-big{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 5px 12px rgba(10,27,77,.25)}
.soc-big:active{transform:scale(.94)}
.soc-big svg{width:36px;height:36px}
.social-note{text-align:center;font-weight:500;font-size:15px;color:var(--muted)}

/* ---------- Footer ---------- */
.footer{margin-top:18px;background:radial-gradient(circle at 20% 30%,rgba(30,90,230,.35),transparent 55%),var(--navy-900);color:#fff;padding:26px 14px 30px}
.footer__inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.brand--light .brand__text{text-align:left}
.brand--light .brand__text strong{color:#fff}
.brand--light .brand__text strong b{color:#4da3ff}
.brand--light .brand__text small{color:#cfe0ff}
.footer__mid{width:100%;font-size:14px;border-top:1px solid rgba(255,255,255,.2);padding-top:18px}
.footer__nav,.footer__legal{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px}
.footer__nav a,.footer__legal a{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.1);font-size:14px}
.footer__mid p{margin-top:14px}
.footer__legal{margin-top:12px}
.footer__tag em{display:block;font:italic 600 21px/1.25 var(--font);text-shadow:0 0 12px rgba(100,170,255,.7)}
.footer__tag svg{width:170px;margin:6px auto 0}

/* =========================================================
   TABLET  ≥ 720px
   ========================================================= */
@media (min-width:720px){
  .topbar__left span:last-child,.topbar__sep{display:block}
  .topbar__sep{width:1px;height:18px;background:rgba(255,255,255,.4)}
  .topbar__right>span{display:inline}
  .brand__logo{width:60px;height:70px}
  .brand__text strong{font-size:25px}.brand__text small{font-size:15px}
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center;padding:26px 56px 44px 30px}
  .hero__arrow{top:50%}
  .hero__copy{margin:0;text-align:left}
  .hero__copy h1{font-size:34px}.hero__copy h1 span{font-size:38px}
  .hero__sub br{display:inline}
  .hero__dots{position:absolute;left:0;right:0;bottom:14px;margin:0}
  .strip{flex-direction:row;align-items:stretch}
  .strip__item{flex:1}
  .strip .btn{width:auto;align-self:center}
  .about{grid-template-columns:200px 1fr;align-items:center}
  .about__img{height:210px}
  .about__copy .btn,.col .btn{width:auto}
  .aware{grid-template-columns:repeat(3,1fr)}
  .card:last-child{grid-column:auto;min-height:124px}
  .alertband{grid-template-columns:1fr 1fr}
  .alertband__right{padding-block:20px}
  .trio{grid-template-columns:1fr 1fr}
  .trio .col:last-child{grid-column:1/-1}
  .social-big{justify-content:center;gap:24px}
  .footer__inner{flex-direction:row;flex-wrap:wrap;justify-content:space-between;text-align:left}
  .footer__mid{order:3;border-top:1px solid rgba(255,255,255,.2)}
  .footer__tag{text-align:right}
}

/* =========================================================
   DESKTOP ≥ 1024px
   ========================================================= */
@media (min-width:1024px){
  .container{padding-inline:16px}
  .topbar__inner{max-width:1240px;margin:auto;min-height:48px;font-size:14px}
  .header__inner{max-width:1240px;margin:auto;min-height:96px;padding-inline:16px}
  .nav-toggle{display:none}
  .nav{display:flex;position:static;flex-direction:row;padding:0;box-shadow:none;background:none;gap:4px}
  .nav__link{min-height:0;padding:10px 14px;font-size:15px;white-space:nowrap;background:none;border-radius:999px}
  .nav__link:hover{background:var(--blue-100)}
  .nav__link.is-active{background:linear-gradient(180deg,#1b6bff,#0b45c9)}
  .brand__logo{width:84px;height:96px}
  .brand__text strong{font-size:28px}.brand__text small{font-size:17px}
  .hero{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);padding:24px 64px 50px 36px;gap:34px}
  .hero__copy h1{font-size:46px;max-width:480px}.hero__copy h1 span{font-size:50px}
  .hero__row{flex-direction:row;align-items:flex-end;gap:18px}
  .hero__row .btn--yt{width:auto;font-size:18px;min-height:0;padding:12px 22px}
  .hero__checks{background:none;border:0;padding:0;margin-left:auto;font-size:16px}
  .hero__shield{display:block;position:absolute;right:64px;top:18px;width:170px;filter:drop-shadow(0 0 22px rgba(120,200,255,.7));pointer-events:none}
  .hero__dots{left:30%;right:auto}
  .duo{grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}
  .aware{grid-template-columns:repeat(5,1fr);gap:8px}
  .card{min-height:0;padding:24px 6px;font-size:14.5px}.card__ico{width:54px;height:54px}
  .about{grid-template-columns:210px 1fr}
  .alertband{margin-top:16px}
  .alertband__right{padding-left:90px;clip-path:polygon(60px 0,100% 0,100% 100%,0 100%);
    background:repeating-linear-gradient(115deg,#111 0 6px,transparent 6px 22px) left/70px 100% no-repeat,var(--yellow)}
  .alertband__right::after{content:"";position:absolute;right:0;top:0;bottom:0;width:70px;background:repeating-linear-gradient(115deg,#111 0 6px,transparent 6px 22px)}
  .alertband__right{position:relative}
  .alertband h2{font-size:32px}
  .trio{grid-template-columns:1fr 1fr 1fr;gap:0;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 0 22px}
  .trio .col:last-child{grid-column:auto}
  .col{box-shadow:none;border-radius:0;padding:0 20px}
  .col--mid{border-inline:1px solid #d8e1f3}
  .social-big{gap:18px}.soc-big{width:74px;height:74px}
  .footer__inner{max-width:1240px;margin:auto;flex-wrap:nowrap;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px}
  .footer__mid{order:0;border-top:0;border-left:1px solid rgba(255,255,255,.3);padding:0 0 0 22px;text-align:center}
  .footer__nav a,.footer__legal a{background:none;border-radius:0;padding:0 11px;border-left:1px solid rgba(255,255,255,.5);line-height:1.1;white-space:nowrap}
  .footer__nav a:first-child,.footer__legal a:first-child{border-left:0}
  .footer__nav{flex-wrap:nowrap;gap:0}.footer__legal{gap:0}
}

</style>
</head>
